<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art sheet — Landon's Game Room</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { height: auto; overflow: auto; }
  body { display: block; padding: 24px; background: #FFF6E9; }
  h2 { font-size: 22px; margin: 28px 0 10px; color: #4A3426; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  .cell { background: #fff; border-radius: 14px; padding: 8px; text-align: center; font-size: 13px; color: #7C6352; }
  .cell svg, .cell img { display: block; margin: 0 auto 4px; }
  .wide svg { width: 520px; height: auto; }
</style>
</head>
<body>
<h1>Art sheet</h1>
<p>Everything drawn by <code>js/art</code>, for checking the look in one place.</p>
<div id="sheet"></div>
<script type="module" src="art-sheet.js"></script>
</body>
</html>
