<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Landon's Games">
<meta name="theme-color" content="#FFF6E9">
<title>Landon's Game Room</title>
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
</head>
<body>

<div id="viewport">
  <div id="stage">

    <!-- ============ MENU ============ -->
    <section id="screen-menu" class="screen active">
      <div class="backdrop"></div>
      <div class="menu-head"><div id="menu-cat"></div><div class="says">Pick a game!</div></div>
      <div class="menu-grid" id="menu-grid"></div>
    </section>

    <!-- ============ FEELINGS ============ -->
    <section id="screen-feelings" class="screen">
      <div class="backdrop" id="feel-scene"></div>
      <div id="feel-drop"></div>
      <div class="caption panel">
        <button id="feel-hear" class="speak-btn" aria-label="Hear it again"></button>
        <p id="feel-sentence"></p>
      </div>
      <div class="side-panel panel">
        <h2 id="feel-question"></h2>
        <div id="feel-faces"></div>
      </div>
    </section>

    <!-- ============ MATH BUBBLES ============ -->
    <section id="screen-mathpop" class="screen">
      <div class="backdrop"></div>
      <div id="math-problem" class="panel"></div>
      <div id="bubble-area"></div>
    </section>

    <!-- ============ WORD BUILDER ============ -->
    <section id="screen-spelling" class="screen">
      <div class="backdrop"></div>
      <div class="word-picture">
        <div id="spell-picture" class="pic-card"></div>
        <button id="spell-hear" class="speak-btn" aria-label="Hear the word"></button>
      </div>
      <div class="word-shelf"><div id="spell-slots"></div></div>
      <div id="spell-letters"></div>
    </section>

    <!-- ============ ANIMAL MATCH ============ -->
    <section id="screen-memory" class="screen">
      <div class="backdrop"></div>
      <div id="memory-grid"></div>
    </section>

    <!-- ============ COPY CAT ============ -->
    <section id="screen-simon" class="screen">
      <div class="backdrop"></div>
      <div id="simon-cat"></div>
      <div id="simon-says" class="says"></div>
      <div id="simon-pads">
        <button class="simon-pad" data-pad="0" aria-label="red circle"></button>
        <button class="simon-pad" data-pad="1" aria-label="yellow star"></button>
        <button class="simon-pad" data-pad="2" aria-label="green triangle"></button>
        <button class="simon-pad" data-pad="3" aria-label="blue square"></button>
      </div>
      <button id="simon-start" class="btn" data-icon="play">Start</button>
    </section>

    <!-- ============ COUNTING TIME ============ -->
    <section id="screen-counting" class="screen">
      <div class="backdrop"></div>
      <div class="caption panel caption-left">
        <button id="count-hear" class="speak-btn" aria-label="Hear it again"></button>
        <p id="count-prompt"></p>
      </div>
      <div id="count-area"></div>
      <div id="count-basket"><span id="basket-tag" class="count-tag">0</span></div>
      <div id="count-answers"></div>
    </section>

    <!-- ============ PUZZLE BUILDER ============ -->
    <section id="screen-puzzle" class="screen classic">
      <div class="game-header"><p class="game-hint">Drag the pieces to build the picture!</p></div>
      <div class="puzzle-wrap">
        <div id="puzzle-board" class="puzzle-board"></div>
        <div id="puzzle-tray" class="puzzle-tray"></div>
      </div>
    </section>

    <!-- ============ PICTURE PUZZLE ============ -->
    <section id="screen-photopuzzle" class="screen classic">
      <div class="game-header"><p class="game-hint">Pick a photo, then drag the pieces to build it!</p></div>
      <div id="photo-picker">
        <p id="photo-empty" class="game-hint hidden">No photos yet! Grown-ups: put photos in the <b>photos-src</b> folder, run <b>tools/photos.bat</b>, and publish the site.</p>
        <div id="photo-thumbs"></div>
      </div>
      <div id="photo-wrap" class="puzzle-wrap hidden">
        <div id="photo-board" class="puzzle-board"></div>
        <div id="photo-tray" class="puzzle-tray"></div>
      </div>
      <button id="photo-back" class="chunky-btn small hidden">🖼️ Choose another photo</button>
    </section>

    <!-- ============ CHEESE MAZE ============ -->
    <section id="screen-maze" class="screen">
      <div class="backdrop"></div>
      <div id="maze-board"></div>
    </section>

    <!-- ============ SORT IT! ============ -->
    <section id="screen-sortit" class="screen">
      <div class="backdrop"></div>
      <div class="caption panel caption-top">
        <button id="sort-hear" class="speak-btn" aria-label="Hear it again"></button>
        <p id="sort-prompt"></p>
      </div>
      <div id="sort-cards"></div>
      <div id="sort-bin"></div>
    </section>

    <!-- ============ TRACE IT ============ -->
    <section id="screen-trace" class="screen">
      <div class="backdrop"></div>
      <div id="trace-modes">
        <button class="btn trace-mode-btn" data-mode="abc">ABC</button>
        <button class="btn trace-mode-btn" data-mode="lower">abc</button>
        <button class="btn trace-mode-btn" data-mode="num">123</button>
        <button class="btn trace-mode-btn" data-mode="cut" data-icon="scissors">Cut</button>
      </div>
      <div id="trace-stage"></div>
    </section>

    <!-- ============ MUSIC MAKER ============ -->
    <section id="screen-music" class="screen">
      <div class="backdrop"></div>
      <div id="xylo-frame"></div>
      <div id="xylophone"></div>
      <div id="mallet"></div>
      <div id="song-buttons">
        <button class="btn song-btn" data-song="twinkle" data-pic="star">Twinkle Twinkle</button>
        <button class="btn song-btn" data-song="mary" data-pic="sheep">Mary's Lamb</button>
        <button class="btn song-btn" data-song="hotcross" data-pic="bread">Hot Cross Buns</button>
        <button id="music-free" class="btn on" data-icon="music">Play Free</button>
      </div>
    </section>

    <div id="buddy" class="hidden"></div>
  </div>
</div>

<header id="topbar">
  <div id="top-left">
    <button id="home-btn" class="pill hidden" aria-label="Go home" data-icon="home">Home</button>
    <button id="help-btn" class="pill hidden" aria-label="Ask for help" data-icon="help">Help</button>
  </div>
  <div id="title" class="pill"><span id="title-text">Landon's Game Room</span> <span id="title-badge" class="badge"></span></div>
  <div id="top-right">
    <div id="star-count" class="pill" aria-label="Stars earned" data-icon="star"><span id="star-total">0</span></div>
    <button id="music-btn" class="pill round off" aria-label="Music on or off" data-icon="music"></button>
  </div>
</header>

<div id="celebration" class="hidden">
  <div class="cheer-card"><div id="celebration-cat"></div><div id="celebration-text"></div></div>
</div>
<div id="freeze-overlay" class="hidden" data-icon="hourglass"></div>
<div id="confetti-layer"></div>
<div id="rotate-overlay">
  <div data-icon="tablet"></div>
  <p>Turn me sideways!</p>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
